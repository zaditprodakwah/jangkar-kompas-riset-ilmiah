[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarly-core"
version = "1.0.0"
description = "Deterministic Scientific Metrology, Causal Diagnostics, and Metascience Toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Khoiruzzadittaqwa", email = "zadit@ilmify.id" }
]
keywords = [
    "metascience",
    "reproducibility",
    "statistical-forensics",
    "causal-inference",
    "bibliometrics",
    "research-integrity"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0"
]

[project.urls]
Homepage = "https://github.com/zaditprodakwah/jangkar-kompas-riset-ilmiah"
Repository = "https://github.com/zaditprodakwah/jangkar-kompas-riset-ilmiah.git"
Documentation = "https://ilmify.id/lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
